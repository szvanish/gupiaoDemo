services:
  api:
    build: .
    container_name: stock_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内 Redis 通过服务名访问，覆盖 .env 里的 localhost
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stock_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data

volumes:
  redis_data:
